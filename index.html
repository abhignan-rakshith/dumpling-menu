<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicious Momos</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 650px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            min-height: 100vh;
            color: #333;
            line-height: 1.6;
        }
        .lang-switcher {
            text-align: center;
            margin-bottom: 30px;
        }
        .lang-btn {
            background: linear-gradient(145deg, #ff6b6b, #ee5a52);
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 0 8px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(238, 90, 82, 0.3);
            transform: translateY(0);
        }
        .lang-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(238, 90, 82, 0.4);
        }
        .lang-btn.active {
            background: linear-gradient(145deg, #4ecdc4, #44a08d);
            box-shadow: 0 4px 15px rgba(68, 160, 141, 0.3);
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: shimmer 3s ease-in-out infinite;
        }
        @keyframes shimmer {
            0%, 100% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            50% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }
        .header h1 {
            margin: 0;
            font-size: 2.5em;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            position: relative;
            z-index: 1;
        }
        .menu-section {
            margin-bottom: 35px;
        }
        .menu-section-title {
            color: #5a67d8;
            font-size: 1.5em;
            font-weight: 600;
            margin-bottom: 20px;
            border-bottom: 3px solid #e2e8f0;
            padding-bottom: 8px;
            position: relative;
        }
        .menu-section-title::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
        }
        .menu-item {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .menu-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }
        .menu-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s;
        }
        .menu-item:hover::before {
            left: 100%;
        }
        .menu-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }
        .item-name {
            font-weight: 600;
            font-size: 1.2em;
            color: #2d3748;
        }
        .price {
            color: #e53e3e;
            font-weight: 700;
            font-size: 1.1em;
            background: linear-gradient(45deg, #feb2b2, #e53e3e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .description {
            color: #718096;
            font-size: 0.95em;
            margin-top: 8px;
            line-height: 1.5;
            position: relative;
            z-index: 1;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .footer p {
            margin: 10px 0;
            color: #4a5568;
            font-weight: 500;
        }
        .veg-indicator {
            color: #38a169;
            margin-right: 8px;
            font-size: 1.1em;
            filter: drop-shadow(0 0 3px rgba(56, 161, 105, 0.3));
        }
        .non-veg-indicator {
            color: #e53e3e;
            margin-right: 8px;
            font-size: 1.1em;
            filter: drop-shadow(0 0 3px rgba(229, 62, 62, 0.3));
        }
        #menu-content {
            opacity: 1;
            transition: all 0.4s ease;
        }
        
        /* Mobile responsiveness */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            .header h1 {
                font-size: 2em;
            }
            .lang-btn {
                padding: 10px 18px;
                margin: 0 4px;
                font-size: 0.9em;
            }
            .menu-item {
                padding: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="lang-switcher">
        <button class="lang-btn active" onclick="loadLanguage('en')">English</button>
        <button class="lang-btn" onclick="loadLanguage('kn')">ಕನ್ನಡ</button>
        <button class="lang-btn" onclick="loadLanguage('hi')">हिंदी</button>
    </div>

    <div id="menu-content">
        <!-- Content will be loaded here -->
    </div>

    <script>
        async function loadLanguage(lang) {
            // Update button states
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            // Find and activate the correct button
            const targetBtn = document.querySelector(`.lang-btn[onclick*="${lang}"]`);
            if (targetBtn) targetBtn.classList.add('active');

            // Fade out current content
            const content = document.getElementById('menu-content');
            content.style.opacity = '0';

            try {
                // Load the language file
                const response = await fetch(`languages/${lang}.html`);
                if (!response.ok) throw new Error('Language file not found');
                const html = await response.text();
                
                // Small delay for smooth transition
                setTimeout(() => {
                    content.innerHTML = html;
                    content.style.opacity = '1';
                }, 300);
            } catch (error) {
                console.error('Error loading language:', error);
                content.innerHTML = '<p>Error loading menu content</p>';
                content.style.opacity = '1';
            }
        }

        // Load English by default
        window.onload = () => loadLanguage('en');
    </script>
</body>
</html>
